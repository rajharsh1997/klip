[package]
name = "klipd"
version.workspace = true
edition.workspace = true

[dependencies]
klip-common = { path = "../klip-common" }
rusqlite = { version = "0.31", features = ["bundled"] }
wl-clipboard-rs = "0.8"
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nucleo = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"