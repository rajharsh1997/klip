[package]
name = "klip"
version.workspace = true
edition.workspace = true
description = "Klip clipboard manager daemon"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["clipboard", "manager", "daemon"]

[[bin]]
name = "klip"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Harsh Raj <harsh@example.com>"
extended-description = "Background daemon for Klip clipboard manager. Monitors clipboard changes via D-Bus (KDE), polling (GNOME), or X11, and stores history in SQLite."
depends = "$auto, wl-clipboard"
section = "utils"
priority = "optional"
systemd-units = [{ unit-name = "klip", unit-type = "user" }]

[package.metadata.generate-rpm]
assets = [
    { source = "../klip.service", dest = "/usr/lib/systemd/user/klip.service" },
]

[dependencies]
klip-common = { path = "../klip-common" }
rusqlite = { version = "0.31", features = ["bundled"] }
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nucleo = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
wl-clipboard-rs = "0.8"