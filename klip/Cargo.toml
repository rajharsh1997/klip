[package]
name = "klip"
version.workspace = true
edition.workspace = true
description = "Klip clipboard manager daemon"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["clipboard", "manager", "daemon"]

[[bin]]
name = "klipd"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Harsh Raj <harsh@example.com>"
extended-description = "Background daemon for Klip clipboard manager. Monitors clipboard changes via D-Bus (KDE), polling (GNOME), or X11, and stores history in SQLite."
depends = "$auto, wl-clipboard"
section = "utils"
priority = "optional"
assets = [
    ["../target/release/klipd", "usr/bin/klipd", "755"],
    ["../target/release/klip", "usr/bin/klip", "755"],
    ["../icons/klip-48.png", "usr/share/icons/hicolor/48x48/apps/klip.png", "644"],
    ["../icons/klip-128.png", "usr/share/icons/hicolor/128x128/apps/klip.png", "644"],
    ["../icons/klip.png", "usr/share/icons/hicolor/256x256/apps/klip.png", "644"],
    ["../klip.desktop", "usr/share/applications/klip.desktop", "644"],
    ["../klipd.service", "usr/lib/systemd/user/klipd.service", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "../klipd.service", dest = "/usr/lib/systemd/user/klipd.service" },
    { source = "../target/release/klip", dest = "/usr/bin/klip" },
    { source = "../icons/klip-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/klip.png" },
    { source = "../icons/klip-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/klip.png" },
    { source = "../icons/klip.png", dest = "/usr/share/icons/hicolor/256x256/apps/klip.png" },
    { source = "../klip.desktop", dest = "/usr/share/applications/klip.desktop" },
]

[dependencies]
klip-common = { path = "../klip-common" }
rusqlite = { version = "0.31", features = ["bundled"] }
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nucleo = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
wl-clipboard-rs = "0.8"