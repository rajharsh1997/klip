name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-package:
    name: Package (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            format: deb
          - os: fedora-40
            format: rpm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              libgtk-4-dev libadwaita-1-dev \
              libgraphene-1.0-dev libsqlite3-dev \
              libx11-dev libxcb1-dev \
              wl-clipboard
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y \
              gtk4-devel libadwaita-devel \
              graphene-devel libxcb-devel \
              wl-clipboard
          fi

      - name: Install cargo-deb
        if: matrix.format == 'deb'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.format == 'deb'
        run: |
          cargo deb --no-build
          echo "DEB_FILE=$(ls target/debian/*.deb)" >> $GITHUB_ENV

      - name: Install cargo-generate-rpm
        if: matrix.format == 'rpm'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        if: matrix.format == 'rpm'
        run: |
          cargo generate-rpm
          echo "RPM_FILE=$(ls target/generate-rpm/*.rpm)" >> $GITHUB_ENV

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: klip-${{ matrix.format }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  release:
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release) && github.event_name != 'pull_request'
    needs: [build-and-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: klip-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
          generate_release_notes: true
          draft: true