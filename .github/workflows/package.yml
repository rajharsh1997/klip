name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Package (.deb)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev libadwaita-1-dev \
            libgraphene-1.0-dev libsqlite3-dev \
            libx11-dev libxcb1-dev \
            wl-clipboard

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build all binaries
        run: cargo build --release

      - name: Build .deb package
        run: cargo deb -p klip

      - name: Rename .deb with version
        run: |
          mv target/debian/*.deb target/debian/klip_${{ env.VERSION }}_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: klip-deb
          path: target/debian/*.deb

  build-rpm:
    name: Package (.rpm)
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install Rust (up-to-date)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel libadwaita-devel \
            graphene-devel libxcb-devel \
            wl-clipboard \
            cargo rust

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build all binaries
        run: cargo build --release

      - name: Build .rpm package
        run: cargo generate-rpm -p klip

      - name: Rename .rpm with version
        run: |
          mv target/generate-rpm/*.rpm target/generate-rpm/klip-${{ env.VERSION }}-amd64.rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: klip-rpm
          path: target/generate-rpm/*.rpm

  release:
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release) && github.event_name != 'pull_request'
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: klip-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
          generate_release_notes: true
          draft: true
