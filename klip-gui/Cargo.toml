[package]
name = "klip-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "klip"
path = "src/main.rs"

[dependencies]
klip-common = { path = "../klip-common" }
gtk4 = "0.9"
libadwaita = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
anyhow = "1"
nucleo = "0.4"
ksni = { version = "0.3.6", features = ["blocking"] }
async-channel = "2.5.0"
